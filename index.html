  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

amination Preparation<\u002Fdiv>\n        <div class=\"cap-desc\">Generates line-by-line question sequences grounded in document language and prior representations — exposing contradictions and bad-faith positions before you walk in.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cap-cell reveal\">\n        <div class=\"cap-glyph\">⊕<\u002Fdiv>\n        <div class=\"cap-name\">Merit &amp; Strength Scoring<\u002Fdiv>\n        <div class=\"cap-desc\">Reads a matter end to end and returns an honest assessment of what you'll need to prove it, where the gaps are, and how strong the merits really stand.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cap-cell reveal\">\n        <div class=\"cap-glyph\">⊞<\u002Fdiv>\n        <div class=\"cap-name\">Policy Tower Mapping<\u002Fdiv>\n        <div class=\"cap-desc\">For insurance matters: visual reconstruction of every coverage layer, carrier, and attachment point across multi-year programs, with full citation trails.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cap-cell reveal\">\n        <div class=\"cap-glyph\">∿<\u002Fdiv>\n        <div class=\"cap-name\">AI Coverage Counsel<\u002Fdiv>\n        <div class=\"cap-desc\">Ask in plain English — get cited, jurisdictionally-aware answers grounded in your specific documents and the case law that supports your position.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cap-cell reveal\">\n        <div class=\"cap-glyph\">⬡<\u002Fdiv>\n        <div class=\"cap-name\">Privilege-Safe by Design<\u002Fdiv>\n        <div class=\"cap-desc\">Your data never trains our models. Attorney-client privilege protections are built into every workflow. What you upload stays yours.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PIPELINE -->\n<section id=\"pipeline\">\n  <div class=\"s-inner\">\n    <div class=\"reveal\">\n      <div class=\"s-kicker\">How it works<\u002Fdiv>\n      <h2 class=\"s-heading\">From raw documents to <em>recovery strategy< 002Fdiv>\n    <div class=\"security-grid\">\n      <div class=\"security-cell\">\n        <div class=\"security-cell-icon\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"security-cell-label\">Zero Retention<\u002Fdiv>\n        <div class=\"security-cell-text\">Documents are not stored after your session ends. No database, no archive.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"security-cell\">\n        <div class=\"security-cell-icon\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7l-9-5z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"security-cell-label\">Privilege Protected<\u002Fdiv>\n        <div class=\"security-cell-text\">Attorney-client privilege is a foundational design constraint — not a checkbox.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"security-cell\">\n        <div class=\"security-cell-icon\"><svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"4.93\" y1=\"4.93\" x2=\"19.07\" y2=\"19.07\"><\u002Fline><\u002Fsvg><\u002Fdiv>\n        <div class=\"security-cell-label\">No Model Training<\u002Fdiv>\n        <div class=\"security-cell-text\">Your files never train any AI model — ours or any third-party provider.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"security-cell\">\n        <div class=\"security-cell-icon\"><svg viewBox=\"0 0 24 24\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><line x1=\"23\" y1=\"11\" x2=\"17\" y2=\"11\"><\u002Fline><\u002Fsvg><\u002Fdiv>\n        <div class=\"security-cell-label\">No Third Parties<\u002Fdiv>\n        <div class=\"security-cell-text\">We never sell, share, or license your data or document contents to anyone.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"security- line>\n        <path d=\"M6 31 Q12 36 18 31\" stroke=\"var(--gold)\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n        <path d=\"M46 31 Q52 36 58 31\" stroke=\"var(--gold)\" stroke-width=\"2\" fill=\"none\"><\u002Fpath>\n      <\u002Fsvg>\n      <div class=\"foot-wordmark\">Themis<span>OS<\u002Fspan><\u002Fdiv>\n    <\u002Fa>\n    <ul class=\"foot-links\">\n      <li><button onclick=\"openInfoModal('platform')\">Platform<\u002Fbutton><\u002Fli>\n      <li><a href=\"security.html\">Security<\u002Fa><\u002Fli>\n      <li><a href=\"/privacy\">Privacy<\u002Fa><\u002Fli>\n      <li><a href=\"/terms\">Terms<\u002Fa><\u002Fli>\n    <\u002Ful>\n    <div class=\"foot-copy\">© 2026 ThemisOS. All rights reserved.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- INFO MODAL (Platform) -->\n<div class=\"modal-overlay\" id=\"info-modal\">\n  <div class=\"info-modal-box\">\n    <div class=\"info-modal-header\">\n      <div>\n        <div class=\"info-modal-kicker\" id=\"info-kicker\">ThemisOS<\u002Fdiv>\n        <div class=\"info-modal-title\" id=\"info-title\">—<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"modal-close\" style=\"position:static;margin-top:4px;\" onclick=\"closeInfoModal()\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"info-modal-body\" id=\"info-body\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst navbar = document.getElementById('navbar');\nwindow.addEventListener('scroll', () => {\n  navbar.classList.toggle('scrolled', window.scrollY > 40);\n}, { passive: true });\n\n/* marquee — build from one set, duplicated for a seamless loop */\nconst MARQUEE = [\n  'Cross-examination prep','Weak-point detection','One-sided language analysis','Case-merit scoring',\n  'Evidence-gap mapping','Policy tower reconstruction','Exclusion analysis','Carrier conflict detection',\n  'Coverage gap detection','Contract review','Allocation modeling','Recovery memo generation','Bad faith documentation'\n];\nconst track = document.getElementById('marquee-track');\nif (track) {\n  const html = MARQUEE.map(t => `<span class=\"marquee-item\"><span class=\"m-dot\"><\u002Fspan>${t}<\u002Fspan>`).join('');\n  track.innerHTML = html + html;\n}\n\nconst observer = new IntersectionObserver((entries) => {\n  entries.forEach((e, i) => {\n    if (e.isIntersecting) {\n      setTimeout(() => e.target.classList.add('visible'), i * 80);\n      observer.unobserve(e.target);\n    }\n  });\n}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });\ndocument.querySelectorAll('.reveal').forEach(el => observer.observe(el));\n\nlet cur = 0;\nconst pipSteps = document.querySelectorAll('.pip-step');\npipSteps.forEach(s => s.addEventListener('click', () => {\n  pipSteps.forEach(x => x.classList.remove('active'));\n  s.classList.add('active');\n}));\nsetInterval(() => {\n  pipSteps[cur].classList.remove('active');\n  cur = (cur + 1) % pipSteps.length;\n  pipSteps[cur].classList.add('active');\n}, 3200);\n\nconst INFO_CONTENT = {\n  platform: {\n    kicker: 'ThemisOS — Overview',\n    title: 'The Platform',\n    body: `\n      <p>ThemisOS is an AI-powered cross-examination, document-reading, and case-analysis platform built specifically for attorneys — tuned for tort, contract, and insurance recovery litigation.<\u002Fp>\n      <div class=\"highlight\">ThemisOS is currently offered as a managed, boutique service. The platform is used directly by our team on your behalf, or with guided access for vetted clients.<\u002Fdiv>\n      <h3>The three core tools<\u002Fh3>\n      <ul>\n        <li><strong>Cross-Examination Engine<\u002Fstrong> — line-by-line question sequences grounded in the documents and the record<\u002Fli>\n        <li><strong>Document Reader<\u002Fstrong> — finds weak points, missing protections, and one-sided language in any document<\u002Fli>\n        <li><strong>Case Analyzer<\u002Fstrong> — what you'll need to prove a matter, where the gaps are, and how strong the merits are<\u002Fli>\n      <\u002Ful>\n      <h3>It also does<\u002Fh3>\n      <ul>\n        <li>Reconstructs insurance policy towers across primary, excess, umbrella, and specialty layers<\u002Fli>\n        <li>Identifies coverage gaps, anti-stacking clauses, and exclusion conflicts<\u002Fli>\n        <li>Generates cite-ready recovery memos ready for counsel review<\u002Fli>\n        <li>Documents bad-faith carrier conduct for extracontractual claims<\u002Fli>\n      <\u002Ful>\n      <h3>How to get access<\u002Fh3>\n      <p>Access is by invitation. Reach out directly: <a class=\"info-contact-link\" href=\"mailto:beckett@themisos.ai\">beckett@themisos.ai<\u002Fa><\u002Fp>\n    `\n  }\n};\n\nfunction openInfoModal(page) {\n  const content = INFO_CONTENT[page];\n  if (!content) return;\n  document.getElementById('info-kicker').textContent = content.kicker;\n  document.getElementById('info-title').textContent = content.title;\n  document.getElementById('info-body').innerHTML = content.body;\n  document.getElementById('info-modal').classList.add('open');\n}\nfunction closeInfoModal() {\n  document.getElementById('info-modal').classList.remove('open');\n}\ndocument.getElementById('info-modal').addEventListener('click', (e) => {\n  if (e.target === document.getElementById('info-modal')) closeInfoModal();\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
